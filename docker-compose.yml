services:
  mongo:
    image: mongo:7
    container_name: vitaline_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - vitaline_mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrations:
    image: mongo:7
    container_name: vitaline_migrations
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: vitaline_clinic
    volumes:
      - ./VitaLineClinic/migrations/mongo/001-init.js:/migrations/001-init.js:ro
    command:
      - sh
      - -c
      - |
        mongosh "$$MONGODB_URI/$$MONGODB_DATABASE" /migrations/001-init.js

  api:
    image: vitaline-backend:local
    build:
      context: ./VitaLineClinic
      dockerfile: Dockerfile
    container_name: vitaline_api
    command: ["api"]
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      VITALINE_APP_NAME: VitaLine Clinic
      VITALINE_ENV: docker
      VITALINE_DATABASE_DRIVER: mongodb
      DATABASE_URL: mongodb://mongo:27017
      MONGODB_DATABASE: vitaline_clinic
      VITALINE_HTTP_ADDRESS: :8080
      VITALINE_LOG_LEVEL: ${VITALINE_LOG_LEVEL:-info}
      VITALINE_LOG_FILE: /app/logs/backend.log
      VITALINE_APPOINTMENT_MIN_LEAD_TIME_MINUTES: ${VITALINE_APPOINTMENT_MIN_LEAD_TIME_MINUTES:-30}
    volumes:
      - ./VitaLineClinic/logs:/app/logs
    ports:
      - "${VITALINE_API_PORT:-8080}:8080"

  frontend:
    image: vitaline-frontend:local
    build:
      context: ./VitaLineClinic
      dockerfile: Dockerfile
    container_name: vitaline_frontend
    command: ["gui"]
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      VITALINE_APP_NAME: VitaLine Clinic
      VITALINE_ENV: docker
      VITALINE_GUI_ADDRESS: :8090
      VITALINE_GUI_API_BASE_URL: http://api:8080
      VITALINE_LOG_LEVEL: ${VITALINE_LOG_LEVEL:-info}
      VITALINE_LOG_FILE: /app/logs/gui.log
    volumes:
      - ./VitaLineClinic/logs:/app/logs
    ports:
      - "${VITALINE_GUI_PORT:-8090}:8090"

volumes:
  vitaline_mongodata:
